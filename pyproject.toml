[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sando-py"
version = "0.0.1"
description = "Faithful Python port of MIT-ACL SANDO trajectory planner"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "pyyaml>=6.0",
    "gurobipy>=11.0",
]

[project.optional-dependencies]
fast = ["numba>=0.58"]
viz  = ["matplotlib>=3.7", "plotly>=5.18"]
test = ["pytest>=7.4", "pytest-xdist>=3.5"]
dev  = ["ruff>=0.4", "mypy>=1.8"]

[tool.setuptools.packages.find]
include = ["sando_py*"]

[tool.ruff]
line-length = 100
target-version = "py310"
